name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - v*
  pull_request:
  schedule:
    - cron: '4 13 * * 2'

env:
  CONFIGURATION: Release
  DOTNET_VERSION: 8.0.x

jobs:
  ci:
    runs-on: ubuntu-latest
    name: ${{ github.event_name != 'schedule' && 'CI' || 'CI (schedule)' }} (Chroma ${{ matrix.chroma }})
    strategy:
      fail-fast: false
      matrix:
        # v2 API: 0.5.16, the first release with it; 0.5.20, the first that rejects embeddings of different dimensions;
        # 0.6.3, the last 0.x; 1.0.0, the first 1.x; 1.5.9, the current release; latest catches new releases without blocking.
        chroma: ['0.5.16', '0.5.20', '0.6.3', '1.0.0', '1.5.9', 'latest']
        include:
          # v1 API, with ChromaApiVersion.V1: 0.4.10, without tenants and databases; 0.4.15, without count_collections
          # and $not_contains; 0.4.23, with both; 0.5.15, the last release with only the v1 API. See docs/COMPATIBILITY.md.
          - chroma: '0.4.10'
            api: v1
          - chroma: '0.4.15'
            api: v1
          - chroma: '0.4.23'
            api: v1
          - chroma: '0.5.15'
            api: v1
          - chroma: '1.5.9'
            pack: true
    continue-on-error: ${{ matrix.chroma == 'latest' }}
    env:
      CHROMA_IMAGE: chromadb/chroma:${{ matrix.chroma }}
      CHROMA_TEST_API_VERSION: ${{ matrix.api }}
      # An environment variable, so that the restore in the Build step reads it too:
      # pack --no-build takes the package id of the referenced client project from that restore.
      PackageIdPrefix: ${{ vars.PACKAGE_ID_PREFIX }}

    steps:
    - uses: actions/checkout@v4

    - name: CI version suffix
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: echo 'VERSION_SUFFIX=ci-${{ github.run_id }}' >> $GITHUB_ENV

    - name: Release version suffix
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run: echo 'VERSION_SUFFIX=' >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build
      run: dotnet build -c ${{ env.CONFIGURATION }} --version-suffix '${{ env.VERSION_SUFFIX }}'

    - name: Test
      run: dotnet test -c ${{ env.CONFIGURATION }} --no-build --verbosity normal --logger 'GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true'

    - name: Test in a non-default tenant and database
      run: dotnet test -c ${{ env.CONFIGURATION }} --no-build --verbosity normal --logger 'GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true'
      env:
        CHROMA_TEST_TENANT: test_tenant
        CHROMA_TEST_DATABASE: test_database

    - name: Pack
      if: ${{ matrix.pack }}
      run: dotnet pack -c ${{ env.CONFIGURATION }} --no-build --version-suffix '${{ env.VERSION_SUFFIX }}'

    - name: Upload
      if: ${{ matrix.pack && github.event_name != 'schedule' }}
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: |
          **/*.nupkg
          **/*.snupkg

    # Runs after Pack: it rebuilds the netstandard2.0 client without the version suffix.
    - name: Test the netstandard2.0 build
      if: ${{ matrix.pack }}
      run: dotnet test ChromaDB.Client.Tests -c ${{ env.CONFIGURATION }} -p:ChromaClientTargetFramework=netstandard2.0 --verbosity normal --logger 'GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true'

  trimming:
    # The client published with trimming and with NativeAOT, where reflection-based serialization is off,
    # running real requests: Samples/ChromaDB.Client.TrimmingTest. Every trimming or AOT warning is an error.
    # --lists: Chroma 1.5.9 stores lists in metadata, so a rejected list is a failure.
    runs-on: ubuntu-latest
    name: Trimming and NativeAOT
    services:
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8000:8000

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: NativeAOT prerequisites
      run: sudo apt-get install -y clang zlib1g-dev

    - name: Wait for Chroma
      run: for i in $(seq 1 60); do curl -sf http://localhost:8000/api/v2/heartbeat && break; sleep 1; done

    - name: Publish with trimming
      run: dotnet publish Samples/ChromaDB.Client.TrimmingTest -c ${{ env.CONFIGURATION }} -r linux-x64 -o trimmed -p:TreatWarningsAsErrors=true

    - name: Run with trimming
      run: ./trimmed/ChromaDB.Client.TrimmingTest http://localhost:8000 --lists

    - name: Publish with NativeAOT
      run: dotnet publish Samples/ChromaDB.Client.TrimmingTest -c ${{ env.CONFIGURATION }} -r linux-x64 -o aot -p:TrimmingTestAot=true -p:TreatWarningsAsErrors=true

    - name: Run with NativeAOT
      run: ./aot/ChromaDB.Client.TrimmingTest http://localhost:8000 --lists

  publish:
    needs: [ci, trimming]
    # Publishes from the default branch and from version tags: with the NUGET_API_KEY secret in the original
    # repository, and with NuGet trusted publishing where the NUGET_USER variable is set.
    if: ${{ (github.repository == 'ssone95/ChromaDB.Client' || vars.NUGET_USER != '') && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    name: Publish
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download
      uses: actions/download-artifact@v4
      with:
        name: packages

    - name: NuGet login
      if: ${{ vars.NUGET_USER != '' }}
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish to NuGet.org
      run: dotnet nuget push '**/*.nupkg' --api-key ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
