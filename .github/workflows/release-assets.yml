name: Release assets

# Attaches to each GitHub release the packages published on nuget.org, their Sigstore signatures and their build provenance.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, like v2.10.0
        required: true

permissions:
  contents: read

jobs:
  assets:
    name: Packages, signatures and provenance
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Download the packages from nuget.org
      run: |
        version="${TAG#v}"
        mkdir packages
        for id in ChromaDotNet.Client ChromaDotNet.Client.DependencyInjection; do
          lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
          file="packages/$id.$version.nupkg"
          # nuget.org can take a few minutes to serve a new package.
          for attempt in $(seq 1 60); do
            curl -fsSL -o "$file" "https://api.nuget.org/v3-flatcontainer/$lower/$version/$lower.$version.nupkg" && break
            sleep 30
          done
          test -s "$file"
        done

    - name: Sign
      run: |
        for file in packages/*.nupkg; do
          cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
        done

    - name: Attest provenance
      id: attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: packages/*.nupkg

    - name: Add the provenance
      env:
        BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      run: jq -c . "$BUNDLE" > "packages/provenance-$TAG.intoto.jsonl"

    - name: Upload to the release
      run: gh release upload "$TAG" packages/* --clobber --repo "$GITHUB_REPOSITORY"
